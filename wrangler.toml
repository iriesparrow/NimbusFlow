# Cloudflare Workers Builds fallback config.
# The canonical worker config lives in docs/backend/wrangler.toml (used when the
# build's Root directory is set to /docs/backend). This root-level copy exists so
# a build running at the repo root still finds and deploys the same worker.
name = "wellbeing-notion"
main = "docs/backend/worker.js"
compatibility_date = "2024-11-01"
keep_vars = true
